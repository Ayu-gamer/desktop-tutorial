<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todo 列表 · V2.0 TypeScript 版</title>
  <style>
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 2rem 1rem;
      box-sizing: border-box;
    }
    .todo-container {
      background: white;
      width: 100%;
      max-width: 520px;
      padding: 2rem 1.8rem;
      border-radius: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.08);
      border: 1px solid #e2e8f0;
    }
    h2 {
      margin: 0 0 1.5rem;
      font-size: 1.8rem;
      font-weight: 600;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2::before { content: '✓'; font-size: 2rem; color: #3b82f6; line-height: 1; }

    .input-area { display: flex; gap: 10px; margin-bottom: 1.2rem; }
    #todoInput {
      flex: 1; padding: 0.75rem 1rem; font-size: 1rem;
      border: 1.5px solid #e2e8f0; border-radius: 14px;
      outline: none; transition: border-color .2s, box-shadow .2s;
    }
    #todoInput:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,.15); }
    #addBtn {
      background: #3b82f6; color: white; border: none;
      padding: 0 1.5rem; border-radius: 14px; font-size: 1rem;
      font-weight: 500; cursor: pointer;
    }
    #addBtn:hover { background: #2563eb; }

    /* 筛选按钮 */
    .filters {
      display: flex; gap: 6px; margin-bottom: 1rem;
    }
    .filters button {
      flex: 1; padding: 0.5rem; border-radius: 10px;
      border: 1px solid #e2e8f0; background: #f8fafc;
      color: #475569; cursor: pointer; font-size: 0.9rem;
    }
    .filters button.active {
      background: #3b82f6; color: white; border-color: #3b82f6;
    }

    /* 列表 */
    .list-wrapper {
      background: #f1f5f9; border-radius: 18px; padding: 0.5rem;
      min-height: 80px; max-height: 360px; overflow-y: auto;
      border: 1px solid #e2e8f0;
    }
    #todoList { list-style: none; margin: 0; padding: 0.25rem;
      display: flex; flex-direction: column; gap: 6px; }

    .todo-item {
      background: white; padding: 0.7rem 1rem; border-radius: 14px;
      font-size: 1rem; color: #1e293b;
      border: 1px solid #e9eef3;
      display: flex; align-items: center; gap: 10px;
      word-break: break-word;
    }
    .todo-item.completed .todo-text {
      text-decoration: line-through; color: #94a3b8;
    }
    .todo-item input[type="checkbox"] { cursor: pointer; flex-shrink: 0; }
    .todo-text { flex: 1; }
    .remove-btn {
      background: transparent; border: none; cursor: pointer;
      color: #cbd5e1; font-size: 1.2rem; padding: 0 4px;
    }
    .remove-btn:hover { color: #ef4444; }
    .edit-btn {
      background: transparent; border: none; cursor: pointer;
      color: #94a3b8; font-size: 1rem; padding: 0 4px;
    }
    .edit-btn:hover { color: #3b82f6; }
    .todo-edit {
      flex: 1; min-width: 0; font-size: 1rem; color: #1e293b;
      padding: 0.35rem 0.5rem; border: 1.5px solid #3b82f6;
      border-radius: 8px; outline: none;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    .empty-message {
      text-align: center; color: #94a3b8; font-size: 0.95rem;
      padding: 2rem 0.5rem; background: white;
      border-radius: 14px; border: 1px dashed #cbd5e1;
    }

    .footer {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 1rem; font-size: 0.85rem; color: #64748b;
    }
    #clearCompleted {
      background: transparent; border: 1px solid #e2e8f0;
      color: #64748b; padding: 0.4rem 0.8rem;
      border-radius: 8px; cursor: pointer; font-size: 0.85rem;
    }
    #clearCompleted:hover { color: #ef4444; border-color: #ef4444; }
  </style>
</head>
<body>
  <div class="todo-container">
    <h2>Todo 列表 V2.0 · TS</h2>

    <div class="input-area">
      <input type="text" id="todoInput" placeholder="输入待办事项..." autocomplete="off" />
      <button id="addBtn">添加</button>
    </div>

    <div class="filters">
      <button data-filter="all" class="active">全部</button>
      <button data-filter="active">未完成</button>
      <button data-filter="completed">已完成</button>
    </div>

    <div class="list-wrapper">
      <ul id="todoList"></ul>
    </div>

    <div class="footer">
      <span id="counter">0 项</span>
      <button id="clearCompleted">清除已完成</button>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
